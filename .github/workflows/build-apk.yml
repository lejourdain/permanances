name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install deps
        run: |
          npm install
          npm install --no-save @capacitor/assets
      - name: Add Android
        run: npx cap add android
      - name: Generate icons
        run: npx @capacitor/assets generate --android || echo "icones-par-defaut"
      - name: Sync
        run: npx cap sync android
      - name: Build debug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Permanences-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
