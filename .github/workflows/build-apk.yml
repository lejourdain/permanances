name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install deps
        run: |
          npm install
          npm install --no-save @capacitor/assets
      - name: Add Android
        run: npx cap add android
      - name: Generate icons
        run: npx @capacitor/assets generate --android || echo "icones-par-defaut"
      - name: Sync
        run: npx cap sync android
      - name: Build release
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ]; then
            echo "Secrets de signature absents."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "Build-tools: $BT"
          echo "APK: $UNSIGNED"
          "${BT}zipalign" -f 4 "$UNSIGNED" aligned.apk
          "${BT}apksigner" sign --ks release.keystore --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out Permanences.apk aligned.apk
          "${BT}apksigner" verify Permanences.apk
          echo "Signature OK"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Permanences-APK
          path: Permanences.apk
          if-no-files-found: error
